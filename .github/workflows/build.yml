name: Build MelodyLink Bose

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform 37
        shell: bash
        run: sdkmanager --install "platforms;android-37.0"

      - name: Build release APK
        # Release only. The debug variant was a second full compile of the same sources for
        # an artifact nobody installs — roughly doubling CI time. Release is also the
        # variant that matters: it is what gets sideloaded as an LSPosed module.
        # `withoutDebug` is not used because assembleRelease alone does not build debug;
        # this step simply no longer asks for it.
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: melodylink-bose-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
