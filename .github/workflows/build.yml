name: Build MelodyLink Bose

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform 37
        shell: bash
        run: sdkmanager --install "platforms;android-37.0"

      # Gradle's own caches. Without these every run re-resolves the whole
      # dependency graph and re-runs the Kotlin/Compose compiler from scratch,
      # which is most of the wall time on a cold runner. A typo in a 5000-line
      # HookModule.java otherwise costs a full 3-minute round trip, so making
      # the loop cheap matters more than making the build clever.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Build outputs, so a failed compile still leaves the previous APK's
      # task history in place for the next attempt to reuse.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: app/build
          key: build-${{ runner.os }}-${{ hashFiles('app/src/main/**') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Build release APK
        # Release only. The debug variant was a second full compile of the same
        # sources for an artifact nobody installs — roughly doubling CI time.
        # Release is also the variant that matters: it is what gets sideloaded as
        # an LSPosed module, and it must stay non-minified because HookModule
        # resolves host methods reflectively by name.
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: melodylink-bose-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
